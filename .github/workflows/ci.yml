name: Agentflow_AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Test Multi-Agent Engine & Build React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Backend Multi-Agent Verification Suite
        working-directory: ./backend
        run: node test_flow.js

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build React 19 (Vite) Production Bundle
        working-directory: ./frontend
        run: npm run build
